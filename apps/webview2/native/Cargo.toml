[package]
name = "local-file-transfer-webview2-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "LocalFileTransferPreview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.18.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", features = ["custom-protocol", "dynamic-acl"] }
windows-sys = { version = "=0.61.2", features = [
   "Win32_Foundation",
   "Win32_Security",
   "Win32_Security_Cryptography",
   "Win32_Storage_FileSystem",
   "Win32_System_JobObjects",
   "Win32_System_Memory",
   "Win32_System_Power",
   "Win32_System_Registry",
   "Win32_System_Threading",
   "Win32_UI_Shell",
   "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
