<!doctype html>
<html lang="ja">
   <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Local File Transfer WebView2 Preview</title>
      <style>
         :root { color-scheme: light; font-family: "Segoe UI", "Yu Gothic UI", sans-serif; color: #243b32; background: #f5f7f4; }
         body { margin: 0; padding: 28px 20px; }
         .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: #dceadf; color: #255d3f; font-size: 24px; }
         h1 { font-size: 19px; line-height: 1.4; font-weight: 650; margin: 20px 0 8px; }
         p { font-size: 13px; line-height: 1.7; margin: 10px 0; }
         .preview { font-size: 11px; color: #60766a; }
         .loading { width: 100%; height: 4px; border-radius: 4px; margin-top: 22px; background: #dce6dd; overflow: hidden; }
         .loading::after { content: ""; display: block; width: 34%; height: 100%; background: #4a8960; animation: progress 1.2s ease-in-out infinite alternate; }
         @keyframes progress { to { transform: translateX(194%); } }
         @media (prefers-reduced-motion: reduce) { .loading::after { animation: none; } }
      </style>
   </head>
   <body>
      <div class="mark" aria-hidden="true">↔</div>
      <h1>Local File Transfer</h1>
      <p class="preview">WebView2 Preview</p>
      <p id="status" role="status">転送ルームを準備しています。</p>
      <div class="loading" aria-hidden="true"></div>
   </body>
</html>
